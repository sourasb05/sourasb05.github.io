name: Update conferences and special issues

on:
  schedule:
    - cron: "0 5 * * 1"   # every Monday 05:00 UTC
  workflow_dispatch:       # allow running it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/update_conferences.py
      - run: python scripts/update_special_issues.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/conferences.js assets/js/special_issues.js
          git commit -m "Update conference deadlines and special issues"
          git push
